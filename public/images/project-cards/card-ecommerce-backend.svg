  <text x="50" y="640" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">Production e-commerce backend APIs for catalog, carts, inventory,</text>
  <text x="50" y="675" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">and checkout with Razorpay webhook payment reconciliation and</text>
