      <rect x="317" y="780" width="83" height="38" rx="19" fill="#071224" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <text x="358.5" y="804" font-family="monospace" font-size="16" font-weight="bold" fill="#7dd3fc" text-anchor="middle">MySQL</text>
    
      <rect x="412" y="780" width="83" height="38" rx="19" fill="#071224" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <text x="453.5" y="804" font-family="monospace" font-size="16" font-weight="bold" fill="#7dd3fc" text-anchor="middle">Nginx</text>
    

