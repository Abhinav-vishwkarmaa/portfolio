  <text x="50" y="640" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">Workflow-driven backend for maritime compliance certification</text>
  <text x="50" y="675" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">with role-based multi-tier approvals, cryptographic QR code</text>
  <text x="50" y="710" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">verification, tamper-evident audit logging, and automated alerts.</text>

  <!-- Tech Stack Pills Row -->
  
      <rect x="50" y="780" width="105" height="38" rx="19" fill="#071224" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <text x="102.5" y="804" font-family="monospace" font-size="16" font-weight="bold" fill="#7dd3fc" text-anchor="middle">Node.js</text>
    
      <rect x="167" y="780" width="138" height="38" rx="19" fill="#071224" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
