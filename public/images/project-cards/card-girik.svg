  <text x="50" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="-0.5">GIRIK Maritime System</text>
  <text x="50" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#818cf8" letter-spacing="-0.5">Certification &amp; Audit Workflow</text>

