      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="bottomFade_girik" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050812" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050812" stop-opacity="0.95"/>
    </linearGradient>
    
    <clipPath id="previewClip_girik">
      <rect x="34" y="34" width="672" height="445" rx="24" />
