  </defs>

  <!-- Outer Glass Frame -->
  <rect x="12" y="12" width="716" height="1056" rx="36" fill="url(#cardBg_konvo-shoes)" stroke="url(#cardBorder_konvo-shoes)" stroke-width="3"/>
  <rect x="18" y="18" width="704" height="1044" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

