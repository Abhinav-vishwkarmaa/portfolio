  <text x="50" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Konvo Shoes – B2B Footwear</text>
  <text x="50" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#10b981" letter-spacing="-0.5">Scalable Enterprise Commerce</text>

