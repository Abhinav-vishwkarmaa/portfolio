  <text x="50" y="710" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">optimization, and asynchronous BullMQ Redis background jobs.</text>

  <!-- Tech Stack Pills Row -->
  
      <rect x="50" y="780" width="105" height="38" rx="19" fill="#071224" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
