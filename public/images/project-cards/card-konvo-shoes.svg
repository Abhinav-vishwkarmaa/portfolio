      <text x="386" y="804" font-family="monospace" font-size="16" font-weight="bold" fill="#7dd3fc" text-anchor="middle">PostgreSQL</text>
    
      <rect x="467" y="780" width="94" height="38" rx="19" fill="#071224" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
      <text x="514" y="804" font-family="monospace" font-size="16" font-weight="bold" fill="#7dd3fc" text-anchor="middle">BullMQ</text>
    

